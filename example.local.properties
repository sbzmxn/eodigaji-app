## Eodigaji Android App - Local Configuration Example
##
## [변환 및 사용 방법]
## 1. 이 파일(example.local.properties)을 복사하여 프로젝트 루트에 'local.properties'로 생성합니다.
##    - Windows (PowerShell): Copy-Item example.local.properties local.properties
##    - Windows (CMD):        copy example.local.properties local.properties
##    - macOS / Linux:        cp example.local.properties local.properties
## 2. 생성된 local.properties 파일에서 본인의 Android SDK 경로와 API 키를 입력합니다.
#
# 1. Android SDK 경로 (필수)
sdk.dir=/path/to/your/Android/Sdk
# Windows 예시: sdk.dir=C\:\\Users\\username\\AppData\\Local\\Android\\Sdk
# macOS 예시:   sdk.dir=/Users/username/Library/Android/sdk

# 2. 어디가지 추천 서버 (eodigaji-api) 연동 클라이언트 API KEY (선택)
# - 서버의 EODIGAJI_CLIENT_API_KEY 설정값과 일치해야 합니다.
# - 값을 지정하면 모든 API 요청 시 X-API-KEY 헤더가 자동으로 전송됩니다.
# - 기본키는 제공되지 않으며, 미입력 시 빈 문자열("")로 빌드되어 인증이 비활성화된 개발 서버와 통신합니다.
EODIGAJI_API_KEY=

# 3. 어디가지 추천 서버 주소 (API Base URL, 필수)
# - 기본 제공 주소(Default URL)가 없으므로 연결할 추천 API 서버 주소를 직접 입력해야 합니다.
# - Retrofit baseUrl 규격에 따라 URL 끝은 반드시 '/'로 끝나야 합니다. (예: https://your-api-server.com/ 또는 http://10.0.2.2:8000/)
EODIGAJI_API_BASE_URL=
